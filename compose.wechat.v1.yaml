# V1.0.0 deployment of unchanged application code; review exceptions remain recorded.
# Never combine this file with another Compose deployment.
name: verseviva-wechat
services:
  app:
    image: verseviva-wechat-app:v1.0.0
    restart: unless-stopped
    env_file: .env.wechat.v1
    command: ["uvicorn", "server.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    mem_limit: 3g
    cpus: 1.0
    volumes:
      - wechat-data:/app/data
      - wechat-model-cache:/root/.cache
    expose: ["8000"]
    networks:
      default: {}
      ingress:
        aliases: [verseviva-wechat-api]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  ingress:
    external: true
    name: ${WECHAT_INGRESS_NETWORK:?Set the existing Caddy Docker network}
volumes:
  wechat-data:
  wechat-model-cache:
